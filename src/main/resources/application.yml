spring:
  application:
    name: todayter

  config:
    import: optional:file:./.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

jwt:
  secret: ${JWT_SECRET}
  access-expire: ${JWT_ACCESS_TOKEN_EXPIRE_MS}
  refresh-expire: ${JWT_REFRESH_TOKEN_EXPIRE_MS}

google:
  places:
    base-url: https://places.googleapis.com/v1
    api-key: ${GOOGLE_PLACES_API_KEY:}
    thumbnail-max-width: 800
    connect-timeout: 3s
    read-timeout: 5s

fortune-report:
  max-retries: ${FORTUNE_REPORT_MAX_RETRIES:3}
  sazu:
    base-url: ${SAZU_API_BASE_URL:https://api.sazu.app}
    api-key: ${SAZU_API_KEY:}
    connect-timeout: 3s
    read-timeout: 10s
  openai:
    base-url: ${OPENAI_API_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    prompt-resource: classpath:prompts/fortune-report.txt
    connect-timeout: 3s
    read-timeout: 120s
    
kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
