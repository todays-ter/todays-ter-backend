server:
  forward-headers-strategy: framework

spring:
  application:
    name: todayter

  config:
    import: optional:file:./.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-expire: ${JWT_ACCESS_TOKEN_EXPIRE_MS}
  refresh-expire: ${JWT_REFRESH_TOKEN_EXPIRE_MS}

google:
  places:
    base-url: https://places.googleapis.com/v1
    api-key: ${GOOGLE_PLACES_API_KEY:}
    thumbnail-max-width: 800
    connect-timeout: 3s
    read-timeout: 5s

fortune-report:
  max-retries: ${FORTUNE_REPORT_MAX_RETRIES:10}
  mock-enabled: ${FORTUNE_REPORT_MOCK_ENABLED:}
  mock-template-report-id: ${FORTUNE_REPORT_MOCK_TEMPLATE_REPORT_ID:}
  ablecity:
    base-url: ${ABLECITY_API_BASE_URL:}
    api-key: ${ABLECITY_API_KEY:}
    connect-timeout: 3s
    read-timeout: 10s
  openai:
    base-url: ${OPENAI_API_BASE_URL:}
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    prompt-resource: classpath:prompts/fortune-report.txt
    connect-timeout: 3s
    read-timeout: 120s
    
kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com

apple:
  oauth:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}
    redirect-uri: ${APPLE_REDIRECT_URI}
    auth-base-url: https://appleid.apple.com

logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info

share:
  frontend-base-url: ${FRONTEND_BASE_URL:}
  fortune-report-path: ${FORTUNE_REPORT_SHARE_PATH:}
  recommended-place-path: ${RECOMMENDED_PLACE_SHARE_PATH:}
